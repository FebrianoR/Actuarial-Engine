[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "actuarial-engine"
version = "0.1.0"
description = "PSAK 117 Actuarial Calculation Engine – Backend API"
authors = [{ name = "Actuarial Team" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",       # Excel I/O untuk template asumsi
    "pyxlsb>=1.0.10",        # Excel Binary (.xlsb) reader
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "structlog>=24.1.0",     # Structured logging untuk audit trail
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "hypothesis>=6.100.0",   # Property-based testing untuk validasi aktuaria
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=actuarial_engine --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
