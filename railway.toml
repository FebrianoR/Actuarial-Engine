# ──────────────────────────────────────────────────────────────
#  Railway config – Backend (FastAPI)
#  Railway auto-detects Dockerfile in root
# ──────────────────────────────────────────────────────────────
[build]
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
